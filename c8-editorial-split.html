<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C8 · Editorial Split — Fox One Multi-Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  /* Editorial split: full-bleed cinematic art opens from the center, the lockup holds a strong left column,
     a huge condensed headline sits top-right with an inline trailer, and the next title peeks in from the right edge. */
  :root { --cond: "Oswald", "Bebas Neue", "Arial Narrow", Impact, sans-serif; }
  .stage { background: #000; }

  .slides { position: absolute; inset: 0; z-index: 2; transition: opacity .35s var(--ease-std); }
  .stage.at-rail .slides { opacity: .45; }
  .slide { position: absolute; inset: 0; }

  /* Art opens like a curtain from the center line */
  .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1000px; overflow: hidden;
    clip-path: inset(0 50% 0 50%); transition: clip-path 1.25s var(--ease-inout); }
  .slide.is-in .bg { clip-path: inset(0 0 0 0); }
  .bg img, .bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: var(--fx, 50%) 30%; animation: kb 18s linear both; }
  @keyframes kb { from { transform: scale(1.14); } to { transform: scale(1.02); } }
  .shade { position: absolute; inset: 0; pointer-events: none; background:
    linear-gradient(90deg, rgba(0,0,0,.94) 0%, rgba(0,0,0,.62) 22%, rgba(0,0,0,0) 40%, rgba(0,0,0,0) 56%, rgba(0,0,0,.62) 70%, rgba(0,0,0,.94) 100%),
    linear-gradient(0deg, #000 0%, rgba(0,0,0,.85) 9%, rgba(0,0,0,0) 34%),
    linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 22%); }
  .seam { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; opacity: 0;
    box-shadow: 0 0 24px 6px rgba(255,255,255,.5); }
  .slide.is-in .seam { animation: seam 1.25s var(--ease-inout); }
  @keyframes seam { 0% { opacity: .9; transform: scaleY(.2); } 25% { opacity: .9; transform: scaleY(1); } 100% { opacity: 0; } }

  .slide.is-out .copy { opacity: 0; transform: translateX(calc(var(--dir, 1) * -30px)); transition: opacity .3s, transform .45s var(--ease-std); }

  /* Left column: lockup */
  .lock { position: absolute; z-index: 5; left: 120px; top: 150px; bottom: 150px; width: 580px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .lock > * + * { margin-top: 24px; }
  .lock .logo img { max-width: 540px; max-height: 240px; }
  .lock .ctas { margin-top: 38px !important; }
  .rise > * { opacity: 0; transform: translateY(24px); }
  .slide.is-in .rise > * { animation: rise .8s var(--ease-out) both; animation-delay: calc(.55s + var(--i) * 80ms); }

  /* Right column: condensed headline + inline trailer */
  .edit { position: absolute; z-index: 5; left: 1160px; top: 190px; width: 520px; }
  .head { font: 400 124px/.9 var(--f-display); text-transform: uppercase; letter-spacing: -.005em; }
  .head .ln { display: block; overflow: hidden; padding: 4px 0; margin: -4px 0; }
  .head .ln > span { display: inline-block; white-space: nowrap; transform: translateY(110%);
    transition: transform 1s var(--ease-out); transition-delay: calc(.4s + var(--k) * 90ms); }
  .slide.is-in .head .ln > span { transform: none; }

  .trail { display: flex; align-items: center; gap: 30px; margin-top: 54px; opacity: 0; transform: translateY(20px);
    transition: opacity .7s var(--ease-out) .85s, transform .7s var(--ease-out) .85s; }
  .slide.is-in .trail { opacity: 1; transform: none; }
  .tthumb { position: relative; width: 224px; height: 126px; border-radius: var(--r-tile); overflow: hidden; flex: 0 0 auto;
    box-shadow: 0 14px 34px rgba(0,0,0,.55); outline: 4px solid transparent; outline-offset: 5px; transition: outline-color .2s, transform .25s var(--ease-std); }
  .tthumb img { width: 100%; height: 100%; object-fit: cover; }
  .tplay { display: flex; align-items: center; gap: 18px; }
  .ring { width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); display: grid; place-items: center;
    transition: background .2s, transform .25s var(--ease-std); }
  .ring svg { width: 26px; height: 26px; fill: #fff; margin-left: 5px; transition: fill .2s; }
  .tlabel { font: 400 30px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
  .trail.is-focused .ring { background: #fff; transform: scale(1.1); }
  .trail.is-focused .ring svg { fill: #000; }
  .trail.is-focused .tthumb { outline-color: #fff; transform: scale(1.04); }

  /* Right edge: a peek of the next title, with the dwell timer running down its left edge */
  .peek { position: absolute; z-index: 6; left: 1764px; top: 236px; width: 380px; height: 600px; border-radius: var(--r-tile); overflow: hidden;
    background: #111; box-shadow: -20px 0 60px rgba(0,0,0,.6); outline: 4px solid transparent; outline-offset: 5px;
    transform: translateX(140px); opacity: 0; transition: transform .9s var(--ease-out), opacity .6s var(--ease-std), outline-color .2s; }
  .peek.is-in { transform: none; opacity: 1; transition-delay: .5s, .5s, 0s; }
  .peek.is-out { transform: translateX(-120px) scale(1.06); opacity: 0; transition-delay: 0s; }
  .peek > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--fx, 50%) 50%; }
  .peek::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0) 45%), linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,0) 40%); }
  .peek .plogo { position: absolute; z-index: 2; left: 18px; bottom: 22px; width: 124px; height: 64px; }
  .peek .plogo img { width: 100%; height: 100%; object-fit: contain; object-position: left bottom; }
  .ptimer { position: absolute; z-index: 6; left: 1740px; top: 236px; width: 4px; height: 600px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
  .ptimer i { position: absolute; left: 0; right: 0; top: 0; height: var(--p, 0%); background: #fff; }

  /* Focus rings for nav and rail (outside the hero) */
  .fring { position: absolute; z-index: 80; border: 4px solid #fff; border-radius: 14px; pointer-events: none; opacity: 0;
    transition: left .25s var(--ease-std), top .25s var(--ease-std), width .25s var(--ease-std), height .25s var(--ease-std), opacity .2s; }
  .fring.on { opacity: 1; }
  .btn.pressed, .trail.pressed .ring { animation: press .3s var(--ease-std); }
  @keyframes press { 50% { transform: scale(.94); } }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="slides" id="slides"></div>
  <div class="ptimer" id="ptimer"><i></i></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "C8 · Editorial Split",
  notes: "An editorial split. The art opens from the center line like a curtain, the lockup holds the left column, and a huge condensed headline sits top-right with an inline trailer. A peek of the next title sits on the right edge, with the dwell timer running down beside it. Focus starts on the primary CTA; Right goes to +, the bell, then the trailer; Right again brings the peeked title into the hero with focus on its primary CTA. The peek never takes focus. Down goes to the rail, Up to the nav.",
  // Hero focus row = Watch · + · bell · inline trailer; the shared D-pad model pages past the trailer
  heroItems: () => (cur ? [...cur.querySelectorAll(".ctas .btn, .trail")] : []),
});

const D = K.data;
const HEAD = {
  "eagles-cowboys": ["NFC East", "Rivalry"],
  "best-medicine": ["New", "Season", "Streaming"],
  "accused": ["All-New", "Episodes"],
  "fc-juarez": ["Bravos", "de Juárez"],
  "fox-soul": ["Black", "Culture", "Always On"],
};
const slidesEl = document.getElementById("slides");

const timer = document.getElementById("ptimer");
let peek = null;
function showPeek(i) {
  const n = D[(i + 1) % D.length], a = n.art, old = peek;
  peek = document.createElement("div");
  peek.className = "peek";
  peek.style.setProperty("--fx", (n.focusX ?? .5) * 100 + "%");
  peek.innerHTML = `<img src="${a.still || a.poster || a.src}" alt=""><div class="plogo"><img src="${n.logo}" alt="${n.logoAlt || ""}"></div>`;
  K.stage.appendChild(peek);
  requestAnimationFrame(() => requestAnimationFrame(() => peek.classList.add("is-in")));
  if (old) { old.classList.remove("is-focused"); old.classList.add("is-out"); setTimeout(() => old.remove(), 1000); }
}

function bgMedia(it) {
  const a = it.art;
  return a.kind === "video"
    ? `<video src="${a.src}" poster="${a.poster}" muted loop playsinline autoplay></video>`
    : `<img src="${a.src}" alt="">`;
}
function slideHTML(it) {
  const thumb = it.art.still || it.art.poster || it.art.src;
  const lockParts = [K.ui.title(it), K.ui.metaRow(it), K.ui.ctas(it)]
    .map((p, i) => p.replace(/^<(\w+) /, `<$1 style="--i:${i}" `));
  return `
    <div class="bg" style="--fx:${(it.focusX ?? .5) * 100}%">${bgMedia(it)}<div class="shade"></div></div>
    <div class="seam"></div>
    <div class="copy">
      <div class="lock rise">${lockParts.join("")}</div>
      <div class="edit">
        <div class="head">${HEAD[it.id].map((l, k) => `<span class="ln"><span style="--k:${k}">${l}</span></span>`).join("")}</div>
        <div class="trail">
          <div class="tthumb"><img src="${thumb}" alt=""></div>
          <div class="tplay"><span class="ring">${K.ICONS.play}</span><span class="tlabel">Watch<br>${it.type === "live" ? "Highlights" : "Trailer"}</span></div>
        </div>
      </div>
    </div>`;
}
function fitHead(el) {
  const head = el.querySelector(".head"), max = 124;
  head.style.fontSize = max + "px";
  const w = Math.max(...[...head.querySelectorAll(".ln > span")].map((s) => s.offsetWidth));
  head.style.fontSize = Math.min(max, max * 520 / w) + "px";
}

let cur = null;

/* ---------- Slides ---------- */
function show(i, prev, dir) {
  const old = cur;
  const el = document.createElement("div");
  el.className = "slide";
  el.innerHTML = slideHTML(D[i]);
  slidesEl.appendChild(el);
  cur = el;
  fitHead(el);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => fitHead(el));
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("is-in")));
  const v = el.querySelector("video"); if (v) v.play().catch(() => {});
  if (old) {
    old.style.setProperty("--dir", dir || 1);
    old.classList.add("is-out");
    const ov = old.querySelector("video");
    setTimeout(() => { if (ov) ov.pause(); old.remove(); }, 1300);
  }
  showPeek(i);
  timer.style.setProperty("--p", "0%");
}

K.rot = K.Rotator({
  count: D.length,
  durationFor: (i) => D[i].dwell || 8000,
  onChange: show,
  onTick: (p) => timer.style.setProperty("--p", (p * 100).toFixed(1) + "%"),
});
show(0, -1, 1);
K.refreshHud();
</script>
</body>
</html>
