<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C10 · Film Gate — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  /* A strip of film slices across the full-bleed hero. The rotation is the strip: it creeps left the
     whole time, so the next title is always sitting in the frame beside the gate, and its distance to
     the gate is the timer. When it reaches the gate, that frame opens out to fill the screen. */
  .stage { background: #000; }
  .stage .page-nav { mix-blend-mode: screen; }
  .bd { position: absolute; inset: 0; z-index: 1; }
  .bd .art > * { width: 100%; height: 100%; object-fit: cover; }
  .bd.opening { transition: clip-path 1.05s var(--ease-inout); }
  .bd .scrim { background:
      linear-gradient(90deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.45) 30%, rgba(0,0,0,0) 58%),
      linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 18%),
      linear-gradient(0deg, #000 0%, #000 10%, rgba(0,0,0,.55) 22%, rgba(0,0,0,0) 45%); }
  .bd .art > * { animation: drift 16s linear both; }
  @keyframes drift { from { transform: scale(1.06); } to { transform: scale(1); } }

  .copy { position: absolute; z-index: 20; left: 120px; bottom: 410px; width: 760px; display: flex; flex-direction: column; align-items: flex-start; }
  .copy > * + * { margin-top: 20px; }
  .copy .logo img { max-width: 560px; max-height: 190px; }
  .copy .ctas { margin-top: 28px !important; }
  .copy.out { transition: opacity .35s var(--ease-std); opacity: 0; }
  .stagger > * { --delay: 620ms; }

  /* Film band */
  .band { position: absolute; z-index: 15; left: 0; top: 716px; width: 1920px; height: 212px; overflow: hidden;
    background: rgba(6,6,8,.62); box-shadow: 0 0 0 1px rgba(255,255,255,.05); }
  .band::before, .band::after { content: ""; position: absolute; left: 0; right: 0; height: 8px; opacity: .22;
    background: repeating-linear-gradient(90deg, #fff 0 14px, transparent 14px 34px); border-radius: 2px; }
  .band::before { top: 8px; } .band::after { bottom: 8px; }
  .reel { position: absolute; left: 0; top: 26px; height: 160px; will-change: transform; }
  .fr { position: absolute; top: 0; width: 284px; height: 160px; border-radius: 8px; overflow: hidden; background: #111;
    transition: box-shadow .2s var(--ease-std); }
  .fr img { width: 100%; height: 100%; object-fit: cover; }
  .fr .lg { position: absolute; left: 14px; bottom: 12px; width: 150px; height: 44px; display: flex; align-items: flex-end; }
  .fr .lg img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,.8)); }
  .fr .dim { position: absolute; inset: 0; background: #000; pointer-events: none; }

  /* The gate: fixed corner brackets at the left frame slot */
  .gate { position: absolute; z-index: 16; left: 108px; top: 730px; width: 308px; height: 184px; pointer-events: none; }
  .gate i { position: absolute; width: 30px; height: 30px; border: 0 solid #fff; }
  .gate i:nth-child(1) { left: 0; top: 0; border-width: 4px 0 0 4px; border-top-left-radius: 10px; }
  .gate i:nth-child(2) { right: 0; top: 0; border-width: 4px 4px 0 0; border-top-right-radius: 10px; }
  .gate i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 10px; }
  .gate i:nth-child(4) { right: 0; bottom: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 10px; }
  .stage .page-rail { z-index: 18; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div id="bds"></div>
  <div id="copyHost" class="is-active"></div>
  <div class="band"><div class="reel" id="reel"></div></div>
  <div class="gate"><i></i><i></i><i></i><i></i></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script src="shared/hero-focus.js"></script>
<script>
const K = HeroKit.init({
  title: "C10 · Film Gate",
  notes: "A strip of film slices across the full-bleed hero and creeps left the whole time. The next title always sits in the frame beside the gate, and its distance to the gate is the timer. When it reaches the gate, that frame opens out to fill the screen.",
  extraKeys: [["↑ ↓", "Nav / hero / rail"], ["→ past +", "Bring the next title into the hero"]],
});

const N = K.data.length, stage = K.stage, bds = document.getElementById("bds"), reel = document.getElementById("reel"), copyHost = document.getElementById("copyHost");
const GX = 120, FW = 284, FH = 160, PITCH = 308, BAND_Y = 716 + 26;
const still = (d) => d.art.kind === "video" ? (d.art.still || d.art.poster) : d.art.src;
const ease = (t) => 1 - Math.pow(1 - t, 3);

function ctaHtml(d) {
  const list = d.ctas.some((c) => c.icon === "plus") ? d.ctas : [...d.ctas, { icon: "plus", label: "My Stuff" }];
  return list.map((c, k) => k === 0 ? `<span class="btn is-focused">${K.ICONS[c.icon]}${c.label}</span>` : `<span class="btn btn--sq">${K.ICONS[c.icon]}</span>`).join("");
}
function copy(d) {
  const meta = d.meta.filter((m) => !(d.type === "live" && m === "Live"));
  const b = d.type === "live" ? `<span class="badge badge--live"><span class="dot"></span>Live</span>` : d.status ? `<span class="badge badge--new">${d.status.badge}</span>` : "";
  return `<div class="copy stagger">
    ${b ? `<div class="status-row" style="--i:0">${b}</div>` : ""}
    <div class="logo" style="--i:1"><img src="${d.logo}" alt="${d.logoAlt || ""}" draggable="false"></div>
    <div class="meta" style="--i:2">${meta.map((m, k) => k === 0 ? `<span class="net">${m}</span>` : `<span>${m}</span>`).join("")}</div>
    <div class="ctas" style="--i:3">${ctaHtml(d)}</div>
  </div>`;
}

/* Reel: frames k = -1 … 6 around the current index; frame 0 sits in the gate, frame 1 is the peek */
let frames = [];
function buildReel(i) {
  reel.innerHTML = "";
  frames = [];
  for (let k = -1; k <= 6; k++) {
    const d = K.data[(((i + k) % N) + N) % N];
    const el = document.createElement("div"); el.className = "fr";
    el.style.left = GX + k * PITCH + "px";
    el.innerHTML = `<img src="${still(d)}" alt="" draggable="false" style="object-position:${Math.round((d.focusX ?? .5) * 100)}% 50%">
      <div class="lg"><img src="${d.logo}" alt="" draggable="false"></div><div class="dim"></div>`;
    el._k = k; reel.append(el); frames.push(el);
  }
}
/* Shift the reel; frames light up as they approach the gate */
function setShift(x) {
  reel.style.transform = `translateX(${x.toFixed(1)}px)`;
  frames.forEach((el) => {
    const dist = Math.abs(el._k * PITCH + x) / PITCH;           /* 0 = in the gate */
    const o = el._k * PITCH + x < 0 ? .75 : Math.min(.62, Math.max(0, (dist - .15) * .5));
    el.querySelector(".dim").style.opacity = o.toFixed(3);
  });
}

let curBd = null, settle = null;
function show(i, prev, dir = 1) {
  const d = K.data[i];
  /* Backdrop opens out of the gate frame */
  const bd = document.createElement("div"); bd.className = "bd";
  bd.innerHTML = `<div class="art">${K.art(d)}</div><div class="scrim"></div>`;
  const gate = `inset(${BAND_Y}px ${1920 - GX - FW}px ${1080 - BAND_Y - FH}px ${GX}px round 8px)`;
  bd.style.clipPath = prev === undefined ? "inset(0 0 0 0 round 0px)" : gate;
  bd.style.zIndex = 2; bds.append(bd);
  if (prev !== undefined) { void bd.offsetWidth; bd.classList.add("opening"); bd.style.clipPath = "inset(0px 0px 0px 0px round 0px)"; }
  if (curBd) { const old = curBd; old.style.zIndex = 1; setTimeout(() => old.remove(), 1150); }
  curBd = bd;
  K.syncVideos(bd);

  /* Copy re-stages after the frame has opened */
  const oldCopy = copyHost.querySelector(".copy"); if (oldCopy) { oldCopy.classList.add("out"); setTimeout(() => oldCopy.remove(), 380); }
  copyHost.insertAdjacentHTML("beforeend", copy(d));

  /* Reel: rebuild around the new index at the same visual position, then settle into place */
  const from = reel._x ?? 0;
  buildReel(i);
  if (prev !== undefined) settle = { from: from + dir * PITCH, t0: performance.now(), dur: dir > 0 ? 500 : 650 };
  setShift(settle ? settle.from : 0);
  focus && focus.refresh();
}

let focus = null;
K.rot = K.Rotator({
  count: N, minGap: 700,
  durationFor: (i) => K.data[i].dwell || 8000,
  onChange: (i, prev, dir) => show(i, prev, dir),
  onTick: (p) => {
    let x = -p * PITCH;
    if (settle) {
      const t = Math.min(1, (performance.now() - settle.t0) / settle.dur);
      x += (settle.from) * (1 - ease(t));
      if (t >= 1) settle = null;
    }
    reel._x = x; setShift(x);
  },
});
focus = HeroFocus.init(K, {
  ctas: () => [...copyHost.querySelectorAll(".copy:not(.out) .btn")],
});
show(0);
K.refreshHud();
</script>
</body>
</html>
