<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C3 · Now Line — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .stage { background: #000; }
  .bgs { position: absolute; inset: 0; }
  .bg { position: absolute; inset: 0; }
  .bg .art { transform: scale(1.06); transition: transform 2.4s var(--ease-out); }
  .bg.settled .art { transform: none; }
  .bgshade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.45) 38%, rgba(0,0,0,0) 62%), linear-gradient(0deg, rgba(0,0,0,.96) 0%, rgba(0,0,0,.8) 26%, rgba(0,0,0,0) 55%); }
  .edge { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 24px 4px rgba(255,255,255,.55); opacity: 0; z-index: 3; pointer-events: none; }

  /* NOW hairline runs the full height — the hero is anchored to the present */
  .now { position: absolute; z-index: 4; top: 128px; bottom: 120px; width: 0; border-left: 2px dashed rgba(255,255,255,.28); }
  .now__tag { position: absolute; top: 0; left: 10px; white-space: nowrap; font: 800 16px/1 var(--f-ui); letter-spacing: .14em; color: #fff; display: flex; gap: 10px; align-items: center; }
  .now__tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--live-hot); animation: pulse 1.6s infinite; }
  .now__tag span { color: var(--ink-3); letter-spacing: .04em; font-weight: 600; }

  .meta-host { position: absolute; z-index: 6; left: 120px; top: 176px; width: 760px; }
  .meta-host .mw { position: absolute; left: 0; top: 0; width: 760px; }
  .meta-host .meta-block { position: static; width: auto; }
  .meta-host .logo img { max-height: 160px; max-width: 520px; }
  .meta-host .logo--type { font-size: 96px; }
  .mw.out { opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s; }
  .is-active .stagger > * { --delay: 380ms; }

  /* Timeline */
  .tl { position: absolute; z-index: 5; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
  .axis { position: absolute; left: 120px; right: 120px; top: 962px; height: 2px; background: rgba(255,255,255,.22); }
  .tick { position: absolute; top: 954px; width: 1px; height: 18px; background: rgba(255,255,255,.35); }
  .tick b { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font: 700 15px/1 var(--f-ui); color: var(--ink-3); white-space: nowrap; letter-spacing: .06em; }
  .liveseg { position: absolute; top: 958px; height: 10px; border-radius: 5px; background: rgba(224,16,47,.35); overflow: hidden; }
  .liveseg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--live-hot); }
  .pt { position: absolute; top: 955px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #000; box-shadow: inset 0 0 0 3px #fff; }
  svg.leaders { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg.leaders path { fill: none; stroke: rgba(255,255,255,.3); stroke-width: 1.5; transition: stroke .3s; }
  svg.leaders path.on { stroke: #fff; stroke-width: 2.5; }

  .tc { position: absolute; top: 712px; width: 264px; transition: transform .5s var(--ease-out), opacity .3s; opacity: .62; transform-origin: 50% 100%; }
  .tc.on { opacity: 1; transform: translateY(-14px); }
  .tc__when { font: 800 15px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .tc__when i { width: 8px; height: 8px; border-radius: 50%; background: var(--live-hot); animation: pulse 1.6s infinite; }
  .tc[data-type="live"] .tc__when { color: #ff5a6e; }
  .tc__img { position: relative; height: 148px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .tc__img::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); transition: box-shadow .3s; }
  .tc.on .tc__img::after { box-shadow: inset 0 0 0 4px #fff; }
  .tc__img .art { inset: 0; }
  .tc__img img.lg { position: absolute; left: 14px; bottom: 12px; max-width: 150px; max-height: 50px; }
  .tc__img .lgt { position: absolute; left: 14px; bottom: 12px; font: 400 24px/1 "Didot", Georgia, serif; }
  .tc__img .sh { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.65), rgba(0,0,0,0) 65%); }
  .tc__bar { position: absolute; left: 14px; right: 14px; top: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); opacity: 0; }
  .tc.on .tc__bar { opacity: 1; } .tc__bar i { display: block; height: 100%; width: 0; background: #fff; }
  .zone { position: absolute; top: 1004px; font: 700 14px/1 var(--f-ui); letter-spacing: .16em; color: rgba(255,255,255,.35); text-transform: uppercase; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="bgs" id="bgs"></div>
  <div class="bgshade"></div>
  <div class="edge" id="eL"></div><div class="edge" id="eR"></div>
  <div class="now" id="now"><div class="now__tag"><i></i>NOW <span id="clock"></span></div></div>
  <div class="meta-host" id="meta"></div>
  <div class="tl" id="tl"></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "C3 · Now Line",
  notes: "The hero is a living timeline anchored to NOW (log-scaled: hours near now, days at the edges). On-demand titles sit in the past, the live game straddles the now line, and the premiere waits in the future. New art scrubs open from the item's position in time.",
  rail: false,
});
const $ = (id) => document.getElementById(id), N = K.data.length;
// Minutes relative to now (mock): when each title is "anchored" in time
const WHEN = {
  "eagles-cowboys": { t: 0, label: () => `Live · ${K.data[0].score.clock}` },
  "best-medicine":  { t: -1260, label: () => "Aired last night · On demand" },
  "accused":        { t: -2840, label: () => "Aired Tue · On demand" },
  "long-winter":    { t: 6138, label: () => "Sun 8/7c · Premiere" },
};
const NOWX = 900, L = 120, R = 1800, TAU = 30;
const kL = (NOWX - L) / Math.log(1 + 4320 / TAU), kR = (R - NOWX) / Math.log(1 + 8640 / TAU);
const X = (m) => m >= 0 ? NOWX + kR * Math.log(1 + m / TAU) : NOWX - kL * Math.log(1 - m / TAU);

$("now").style.left = NOWX + "px";
const tl = $("tl");
let html = `<div class="axis"></div>`;
[[-4320, "−3D"], [-1440, "−1D"], [-360, "−6H"], [-60, "−1H"], [60, "+1H"], [360, "+6H"], [1440, "+1D"], [4320, "+3D"], [8640, "+6D"]]
  .forEach(([m, l]) => (html += `<div class="tick" style="left:${X(m)}px"><b>${l}</b></div>`));
html += `<div class="zone" style="left:${L}px">On demand</div><div class="zone" style="left:${NOWX + 16}px">Live now</div><div class="zone" style="left:${X(1440) + 10}px">Coming up</div>`;
const live = K.data.find((d) => d.type === "live");
const ls = X(-live.live.startedMinAgo), le = X(live.live.durationMin - live.live.startedMinAgo);
html += `<div class="liveseg" style="left:${ls}px;width:${le - ls}px"><i style="width:${NOWX - ls}px"></i></div>`;

// Cards: ideal centre at their time, then pushed apart (min gap) and pulled back inside the margins
const CW = 264, GAP = 28;
const order = K.data.map((d, i) => ({ i, x: X(WHEN[d.id].t) })).sort((a, b) => a.x - b.x);
order.forEach((o, n) => { o.c = Math.max(o.x, L + CW / 2); if (n) o.c = Math.max(o.c, order[n - 1].c + CW + GAP); });
for (let n = order.length - 1; n >= 0; n--) { const o = order[n]; o.c = Math.min(o.c, (n === order.length - 1 ? R - CW / 2 : order[n + 1].c - CW - GAP)); }
const cx = []; order.forEach((o) => (cx[o.i] = o));
let leaders = "";
K.data.forEach((d, i) => {
  const o = cx[i];
  html += `<div class="pt" style="left:${o.x}px"></div>`;
  html += `<div class="tc" data-type="${d.type}" style="left:${o.c - CW / 2}px">
    <div class="tc__when">${d.type === "live" ? "<i></i>" : ""}${WHEN[d.id].label()}</div>
    <div class="tc__img"><div class="art">${K.art(d, "all", { still: true })}</div><div class="sh"></div>
      ${d.logo ? `<img class="lg" src="${d.logo}" alt="">` : `<div class="lgt">${d.logoText}</div>`}<div class="tc__bar"><i></i></div></div></div>`;
  leaders += `<path data-i="${i}" d="M${o.c},${712 + 175} C${o.c},${930} ${o.x},${920} ${o.x},${955}"/>`;
});
tl.innerHTML = html + `<svg class="leaders" viewBox="0 0 1920 1080">${leaders}</svg>`;
const cards = [...tl.querySelectorAll(".tc")], paths = [...tl.querySelectorAll("svg path")];

function clock() { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + " ET"; }
clock(); setInterval(clock, 15000);

const eL = $("eL"), eR = $("eR");
function show(i, prev) {
  const item = K.data[i], x = cx[i].c;
  // art: scrub open from the card's position
  const bg = document.createElement("div"); bg.className = "bg"; bg.innerHTML = `<div class="art">${K.art(item)}</div>`;
  $("bgs").append(bg); K.syncVideos(bg);
  const old = [...$("bgs").children].slice(0, -1);
  if (prev === undefined) { bg.classList.add("settled"); }
  else {
    const dur = 1150, ease = "cubic-bezier(.65,0,.2,1)";
    bg.animate([{ clipPath: `inset(0 ${1920 - x}px 0 ${x}px)` }, { clipPath: "inset(0 0 0 0)" }], { duration: dur, easing: ease }).onfinish = () => old.forEach((o) => o.remove());
    eL.animate([{ transform: `translateX(${x}px)`, opacity: 1 }, { opacity: 1, offset: .75 }, { transform: "translateX(-10px)", opacity: 0 }], { duration: dur, easing: ease });
    eR.animate([{ transform: `translateX(${x}px)`, opacity: 1 }, { opacity: 1, offset: .75 }, { transform: "translateX(1920px)", opacity: 0 }], { duration: dur, easing: ease });
    requestAnimationFrame(() => bg.classList.add("settled"));
  }
  // metadata
  const m = $("meta"), o = m.querySelector(".mw:not(.out)");
  if (o) { o.classList.add("out"); setTimeout(() => o.remove(), 350); }
  m.insertAdjacentHTML("beforeend", `<div class="mw">${K.metaBlock(item, { noSocial: true, noLivebar: true })}</div>`);
  const nw = m.lastElementChild; void nw.offsetWidth; nw.classList.add("is-active");
  cards.forEach((c, n) => { c.classList.toggle("on", n === i); c.querySelector(".tc__bar i").style.width = "0"; });
  paths.forEach((p) => p.classList.toggle("on", +p.dataset.i === i));
}

K.rot = K.Rotator({
  count: N, minGap: 500,
  durationFor: (i) => (K.data[i].type === "live" ? 11000 : 8000),
  onChange: (i, prev) => show(i, prev),
  onTick: (p, i) => { cards[i].querySelector(".tc__bar i").style.width = (p * 100).toFixed(1) + "%"; },
});
show(0);
K.refreshHud();
</script>
</body>
</html>
