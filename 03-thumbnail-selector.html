<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 · Thumbnail Selector — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .slide { opacity: 0; transition: opacity .6s var(--ease-std); }
  .slide.is-active { opacity: 1; z-index: 3; }
  .slide.is-prev { opacity: 1; z-index: 2; transition: none; }
  .slide .art { transform: scale(1.06); transition: transform 1.6s var(--ease-out); }
  .slide.is-active .art { transform: scale(1); }

  /* Metadata: quick exit left, enter from left */
  .slide .meta-block { transition: opacity .25s, transform .25s; }
  .slide.is-prev .meta-block { opacity: 0; transform: translateX(-24px); }
  .stagger > * { transform: translateX(-30px); }
  .is-active .stagger > * { animation-name: slideIn; --delay: 220ms; animation-duration: .6s; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }

  /* Thumbnail rail inside the card, bottom-right, aligned to CTA baseline */
  .thumbs { position: absolute; z-index: 30; right: var(--pad); bottom: var(--pad); display: flex; gap: 18px; align-items: flex-end; }
  .thumb { width: 176px; transition: transform .45s var(--ease-out), opacity .3s; opacity: .62; transform-origin: center bottom; }
  .thumb.is-active { opacity: 1; transform: scale(1.14); }
  .thumb__img { position: relative; height: 99px; border-radius: 10px; overflow: hidden; background: #111; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .thumb__img::after { content: ""; position: absolute; inset: 0; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); transition: box-shadow .3s; }
  .thumb.is-active .thumb__img::after { box-shadow: inset 0 0 0 3px #fff; }
  .thumb__img .art { transform: none !important; }
  .thumb__img .logo-mini { position: absolute; left: 10px; bottom: 10px; max-width: 110px; max-height: 40px; }
  .thumb__img .logo-mini--type { font: 800 18px/1 var(--f-ui); letter-spacing: -.02em; color: #fff; }
  .thumb__img .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0) 70%); }
  .thumb__bar { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); opacity: 0; }
  .thumb.is-active .thumb__bar { opacity: 1; }
  .thumb__bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; }
  .thumb__label { margin-top: 10px; font: 700 15px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .thumb__label .ldot { width: 8px; height: 8px; border-radius: 50%; background: var(--live-hot); animation: pulse 2.8s ease-in-out infinite; }
  .thumb.is-active .thumb__label { color: #fff; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="card" id="card"><div class="grain"></div></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "03 · Thumbnail Selector",
  notes: "A visible queue: users see what's next and the content type of each item before it rotates in. D-pad ←/→ moves focus along the thumbs. Background swap is fast (600ms) so the hero feels responsive."
});
const card = document.getElementById("card");
K.data.forEach((item, i) => card.insertAdjacentHTML("beforeend", `
  <div class="slide layer"><div class="art">${K.art(item)}</div><div class="scrim"></div>${K.metaBlock(item)}</div>`));

const thumbsHTML = K.data.map((item) => `
  <div class="thumb">
    <div class="thumb__img"><div class="art">${K.art(item, "all", { still: true })}</div><div class="shade"></div>
      ${item.logo ? `<img class="logo-mini" src="${item.logo}" alt="">` : `<div class="logo-mini logo-mini--type">${item.logoText}</div>`}
      <div class="thumb__bar"><i></i></div></div>
  </div>`).join("");
card.insertAdjacentHTML("beforeend", `<div class="thumbs">${thumbsHTML}</div>`);

const slides = [...card.querySelectorAll(".slide")], thumbs = [...card.querySelectorAll(".thumb")];
let t;
function show(i, prev) {
  slides.forEach((s) => s.classList.remove("is-prev"));
  if (prev !== undefined && prev !== i) slides[prev].classList.add("is-prev");
  slides.forEach((s, n) => s.classList.toggle("is-active", n === i));
  K.replay(slides[i]);
  clearTimeout(t); t = setTimeout(() => slides.forEach((s) => s.classList.remove("is-prev")), 700);
  thumbs.forEach((th, n) => { th.classList.toggle("is-active", n === i); th.querySelector(".thumb__bar i").style.width = "0"; });
}
K.rot = K.Rotator({
  count: K.data.length, minGap: 200,
  durationFor: (i) => K.data[i].dwell || 8000,
  onChange: (i, prev) => show(i, prev),
  onTick: (p, i) => { thumbs[i].querySelector(".thumb__bar i").style.width = (p * 100).toFixed(1) + "%"; },
});
show(0);
K.refreshHud();
</script>
</body>
</html>
