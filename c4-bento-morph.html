<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C4 · Bento Morph — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .stage { background: #050506; }
  .tile { position: absolute; border-radius: 22px; overflow: hidden; background: #121214;
    transition: left .95s cubic-bezier(.7, 0, .2, 1), top .95s cubic-bezier(.7, 0, .2, 1), width .95s cubic-bezier(.7, 0, .2, 1), height .95s cubic-bezier(.7, 0, .2, 1), border-radius .95s; }
  .tile .art { inset: 0; }
  .tile.feat { z-index: 2; }

  /* Content tiles */
  .ct .ov { position: absolute; inset: 0; transition: opacity .4s; background: linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0) 70%); }
  .ct.feat .ov { opacity: 0; }
  .ct .ov .lab { position: absolute; left: 18px; bottom: 16px; right: 18px; display: flex; flex-direction: column; gap: 8px; }
  .ct .ov .lab small { font: 800 13px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 7px; align-items: center; }
  .ct .ov .lab small i { width: 8px; height: 8px; border-radius: 50%; background: var(--live-hot); animation: pulse 1.6s infinite; }
  .ct .ov img { max-height: 46px; max-width: 200px; align-self: flex-start; }
  .ct .ov .lt { font: 400 28px/1 "Didot", Georgia, serif; }
  .ct .fbadge { position: absolute; left: 22px; top: 20px; opacity: 0; transition: opacity .4s .5s; }
  .ct.feat .fbadge { opacity: 1; }
  .ct .prog { position: absolute; left: 22px; right: 22px; bottom: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); opacity: 0; transition: opacity .4s; }
  .ct.feat .prog { opacity: 1; } .ct .prog i { display: block; height: 100%; width: 0; background: #fff; }

  /* Facet tiles */
  .fx { padding: 36px 38px; }
  .fx .swap { position: absolute; inset: 36px 38px; transition: opacity .3s, transform .4s var(--ease-out); }
  .fx .swap.out { opacity: 0; transform: translateY(-10px); }
  .info .meta-block { position: static; width: auto; }
  .info .meta-block > * + * { margin-top: 14px; }
  .info .logo img { max-height: 112px; max-width: 100%; }
  .info .logo--type { font-size: 64px; }
  .info .meta { gap: 20px; font-size: 21px; }
  .info .ctas { margin-top: 20px !important; }
  .info .livebar { white-space: nowrap; font-size: 17px; } .info .livebar__track { width: 220px; }
  .is-active .stagger > * { --delay: 120ms; animation-duration: .6s; }

  .aux { background: color-mix(in srgb, var(--acc, #333) 22%, #0d0d0f); transition-property: left, top, width, height, border-radius, background; }
  .aux h4 { font: 800 14px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 18px; display: flex; gap: 8px; align-items: center; }
  .aux h4 i { width: 9px; height: 9px; border-radius: 50%; background: var(--live-hot); animation: pulse 1.6s infinite; }
  .sb { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 18px; align-items: center; font-variant-numeric: tabular-nums; }
  .sb b { font: 800 30px/1 var(--f-ui); } .sb em { font: 800 54px/1 var(--f-ui); font-style: normal; text-align: right; }
  .sb span { height: 8px; border-radius: 4px; background: var(--c); }
  .wp { margin-top: 18px; font: 600 17px/1 var(--f-ui); color: var(--ink-2); }
  .wp .bar { margin-top: 10px; height: 8px; border-radius: 4px; background: #869397; overflow: hidden; } .wp .bar i { display: block; height: 100%; width: 68%; background: #00a5b5; }
  .big { font: 800 118px/.9 var(--f-ui); letter-spacing: -.04em; }
  .big small { font-size: 46px; letter-spacing: -.02em; }
  .sub { margin-top: 14px; font: 500 21px/1.35 var(--f-ui); color: var(--ink-2); max-width: 420px; }
  .aux .countdown { flex-direction: column; align-items: flex-start; gap: 14px; }
  .aux .countdown__u { min-width: 82px; padding: 12px 8px 10px; } .aux .countdown__u b { font-size: 44px; }
  .aux .countdown__units { display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage"><div id="board"></div></div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "C4 · Bento Morph",
  notes: "Each content type gets its own layout of facets. Live = feed + scoreboard + win probability. Series = art + episode or social-proof stat. Premiere = cinemascope art + countdown. The board re-flows between layouts, and the featured title grows out of its thumbnail.",
  rail: false,
});
const board = document.getElementById("board"), N = K.data.length;
const X0 = 120, Y0 = 150, CW = (1680 - 11 * 16) / 12, RH = (880 - 5 * 16) / 6;
const R = ([c1, c2, r1, r2]) => ({ left: X0 + (c1 - 1) * (CW + 16), top: Y0 + (r1 - 1) * (RH + 16), width: (c2 - c1 + 1) * CW + (c2 - c1) * 16, height: (r2 - r1 + 1) * RH + (r2 - r1) * 16 });
const LAYOUT = {
  "eagles-cowboys": { feat: [1, 8, 1, 4], aux: [9, 12, 1, 2], info: [9, 12, 3, 6], t: [[1, 3, 5, 6], [4, 6, 5, 6], [7, 8, 5, 6]] },
  "best-medicine":  { feat: [5, 12, 1, 5], info: [1, 4, 1, 3], aux: [1, 4, 4, 6], t: [[5, 7, 6, 6], [8, 10, 6, 6], [11, 12, 6, 6]] },
  "accused":        { feat: [1, 8, 1, 5], info: [9, 12, 1, 3], aux: [9, 12, 4, 6], t: [[1, 3, 6, 6], [4, 6, 6, 6], [7, 8, 6, 6]] },
  "long-winter":    { feat: [1, 12, 1, 3], info: [1, 4, 4, 6], aux: [5, 8, 4, 6], t: [[9, 12, 4, 4], [9, 12, 5, 5], [9, 12, 6, 6]] },
};

const AUX = {
  "eagles-cowboys": (d) => `<h4><i></i>Live · ${d.score.clock}</h4>
    <div class="sb"><span style="--c:${d.score.away.color};width:8px"></span><b>${d.score.away.abbr}</b><em>${d.score.away.score}</em>
      <span style="--c:${d.score.home.color};width:8px"></span><b>${d.score.home.abbr}</b><em>${d.score.home.score}</em></div>`,
  "best-medicine": () => `<h4>New episode</h4><div class="big">S1<small> · </small>E9</div><div class="sub">New episodes Tuesdays 8/7c on FOX, next day on FOX One.</div>`,
  "accused": (d) => `<h4>${d.sponsor.label} ${d.sponsor.name}</h4><div class="big">96<small>%</small></div><div class="sub">of FOX One viewers recommend it — past 30 days.</div>`,
  "long-winter": (d) => `<h4>World premiere · Sun 8/7c</h4><div class="countdown" data-countdown="${K.T0 + d.countdown.startsInMin * 60000}"><span class="countdown__units"></span></div><div class="sub">Set a reminder and it'll be waiting on your home screen.</div>`,
};

const tiles = K.data.map((d) => {
  const el = document.createElement("div"); el.className = "tile ct";
  el.innerHTML = `<div class="art">${K.art(d)}</div>
    <div class="ov"><div class="lab"><small>${d.type === "live" ? "<i></i>" : ""}${d.typeLabel}</small>${d.logo ? `<img src="${d.logo}" alt="">` : `<div class="lt">${d.logoText}</div>`}</div></div>
    <div class="fbadge">${d.type === "live" ? '<span class="badge badge--live"><span class="dot"></span>Live</span>' : `<span class="badge badge--${(d.status && d.status.kind) || "new"}">${d.shortLabel}</span>`}</div>
    <div class="prog"><i></i></div>`;
  board.append(el); return el;
});
const info = document.createElement("div"); info.className = "tile fx info"; board.append(info);
const aux = document.createElement("div"); aux.className = "tile fx aux"; board.append(aux);

function place(el, r, delay = 0) { el.style.transitionDelay = delay + "ms"; Object.entries(R(r)).forEach(([k, v]) => (el.style[k] = v + "px")); }
function swap(host, html, wait) {
  host.querySelectorAll(".swap").forEach((s) => { s.classList.add("out"); setTimeout(() => s.remove(), 320); });
  setTimeout(() => {
    host.insertAdjacentHTML("beforeend", `<div class="swap">${html}</div>`);
    const s = host.lastElementChild; void s.offsetWidth; s.classList.add("is-active");
    document.dispatchEvent(new Event("tick-now"));
  }, wait);
}

function show(i, prev) {
  const d = K.data[i], L = LAYOUT[d.id];
  place(tiles[i], L.feat, 0);
  let n = 0;
  for (let k = 1; k < N; k++) { const j = (i + k) % N; place(tiles[j], L.t[n++], 40 * k); }
  place(info, L.info, 60); place(aux, L.aux, 90);
  tiles.forEach((t, j) => { t.classList.toggle("feat", j === i); t.querySelector(".prog i").style.width = "0"; });
  aux.style.setProperty("--acc", d.type === "live" ? "#00a5b5" : d.accent);
  const first = prev === undefined;
  swap(info, K.metaBlock(d, { noSocial: true, noCountdown: true }), first ? 0 : 520);
  swap(aux, AUX[d.id](d), first ? 0 : 620);
  K.syncVideos(tiles[i]);
}

K.rot = K.Rotator({
  count: N, minGap: 700,
  durationFor: (i) => (K.data[i].type === "live" ? 11000 : 8000),
  onChange: (i, prev) => show(i, prev),
  onTick: (p, i) => { tiles[i].querySelector(".prog i").style.width = (p * 100).toFixed(1) + "%"; },
});
show(0);
K.refreshHud();
</script>
</body>
</html>
