<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C4 · Bento Morph — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .stage { background: #050506; }
  .tile { position: absolute; border-radius: var(--r-tile); overflow: hidden; background: #121214;
    transition: left .95s cubic-bezier(.7, 0, .2, 1), top .95s cubic-bezier(.7, 0, .2, 1), width .95s cubic-bezier(.7, 0, .2, 1), height .95s cubic-bezier(.7, 0, .2, 1), border-radius .95s; }
  .tile .art { inset: 0; }
  .tile.feat { z-index: 2; }

  /* Content tiles */
  .ct .ov { position: absolute; inset: 0; transition: opacity .4s; background: linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0) 70%); }
  .ct.feat .ov { opacity: 0; }
  .ct .ov .lab { position: absolute; left: 18px; bottom: 16px; right: 18px; display: flex; flex-direction: column; gap: 8px; }
  .ct .ov .lab small { font: 800 13px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 7px; align-items: center; }
  .ct .ov .lab small i { width: 8px; height: 8px; border-radius: 50%; background: var(--live-hot); animation: pulse 1.6s infinite; }
  .ct .ov img { max-height: 46px; max-width: 200px; align-self: flex-start; }
  .ct .ov .lt { font: 800 30px/1 var(--f-display); letter-spacing: -.03em; text-transform: uppercase; }
  .ct .fbadge { position: absolute; left: 22px; top: 20px; opacity: 0; transition: opacity .4s .5s; }
  .ct.feat .fbadge { opacity: 1; }
  .ct .prog { position: absolute; left: 22px; right: 22px; bottom: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); opacity: 0; transition: opacity .4s; }
  .ct.feat .prog { opacity: 1; } .ct .prog i { display: block; height: 100%; width: 0; background: #fff; }

  /* Facet tiles */
  .fx { padding: 36px 38px; }
  .fx .swap { position: absolute; inset: 36px 38px; transition: opacity .3s, transform .4s var(--ease-out); }
  .fx .swap.out { opacity: 0; transform: translateY(-10px); }
  .info .meta-block { position: static; width: auto; }
  .info .meta-block > * + * { margin-top: 14px; }
  .info .logo img { max-height: 112px; max-width: 100%; }
  .info .logo--type { font-size: 64px; }
  .info .meta { gap: 20px; }
  .info .ctas { margin-top: 20px !important; }
  .is-active .stagger > * { --delay: 120ms; animation-duration: .6s; }

  .aux { background: color-mix(in srgb, var(--acc, #333) 22%, #0d0d0f); transition-property: left, top, width, height, border-radius, background; }
  .auxline { position: absolute; left: 0; right: 0; bottom: 0; font: 700 40px/1.12 var(--f-ui); letter-spacing: -.01em; color: #fff; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage"><div id="board"></div></div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "C4 · Bento Morph",
  notes: "Each content type gets its own layout of facets. Live = feed + scoreboard + win probability. Series = art + episode or social-proof stat. Replay = cinemascope art + match facet. The board re-flows between layouts, and the featured title grows out of its thumbnail.",
  rail: false,
});
const board = document.getElementById("board"), N = K.data.length;
const X0 = 120, Y0 = 150, CW = (1680 - 11 * 16) / 12, RH = (880 - 5 * 16) / 6;
const R = ([c1, c2, r1, r2]) => ({ left: X0 + (c1 - 1) * (CW + 16), top: Y0 + (r1 - 1) * (RH + 16), width: (c2 - c1 + 1) * CW + (c2 - c1) * 16, height: (r2 - r1 + 1) * RH + (r2 - r1) * 16 });
const LAYOUT = {
  "eagles-cowboys": { feat: [1, 8, 1, 4], aux: [9, 12, 1, 2], info: [9, 12, 3, 6], t: [[1, 2, 5, 6], [3, 4, 5, 6], [5, 6, 5, 6], [7, 8, 5, 6]] },
  "best-medicine":  { feat: [5, 12, 1, 5], info: [1, 4, 1, 3], aux: [1, 4, 4, 6], t: [[5, 6, 6, 6], [7, 8, 6, 6], [9, 10, 6, 6], [11, 12, 6, 6]] },
  "accused":        { feat: [1, 8, 1, 5], info: [9, 12, 1, 3], aux: [9, 12, 4, 6], t: [[1, 2, 6, 6], [3, 4, 6, 6], [5, 6, 6, 6], [7, 8, 6, 6]] },
  "fc-juarez":      { feat: [1, 12, 1, 3], info: [1, 4, 4, 6], aux: [5, 8, 4, 6], t: [[9, 10, 4, 5], [11, 12, 4, 5], [9, 10, 6, 6], [11, 12, 6, 6]] },
  "fox-soul":       { feat: [5, 12, 1, 4], info: [1, 4, 1, 4], aux: [1, 4, 5, 6], t: [[5, 6, 5, 6], [7, 8, 5, 6], [9, 10, 5, 6], [11, 12, 5, 6]] },
};

// Aux tile carries the one short line, big — no stats or scores
const AUX = (d) => `<div class="auxline">${d.tagline}</div>`;

const tiles = K.data.map((d) => {
  const el = document.createElement("div"); el.className = "tile ct";
  el.innerHTML = `<div class="art">${K.art(d)}</div>
    <div class="ov"><div class="lab">${d.logo ? `<img src="${d.logo}" alt="">` : `<div class="lt">${d.logoText}</div>`}</div></div>
    <div class="fbadge">${K.ui.badge(d, { tile: true })}</div>
    <div class="prog"><i></i></div>`;
  board.append(el); return el;
});
const info = document.createElement("div"); info.className = "tile fx info"; board.append(info);
const aux = document.createElement("div"); aux.className = "tile fx aux"; board.append(aux);

function place(el, r, delay = 0) { el.style.transitionDelay = delay + "ms"; Object.entries(R(r)).forEach(([k, v]) => (el.style[k] = v + "px")); }
function swap(host, html, wait) {
  host.querySelectorAll(".swap").forEach((s) => { s.classList.add("out"); setTimeout(() => s.remove(), 320); });
  setTimeout(() => {
    host.insertAdjacentHTML("beforeend", `<div class="swap">${html}</div>`);
    const s = host.lastElementChild; void s.offsetWidth; s.classList.add("is-active");
    document.dispatchEvent(new Event("tick-now"));
  }, wait);
}

function show(i, prev) {
  const d = K.data[i], L = LAYOUT[d.id];
  place(tiles[i], L.feat, 0);
  let n = 0;
  for (let k = 1; k < N; k++) { const j = (i + k) % N; place(tiles[j], L.t[n++], 40 * k); }
  place(info, L.info, 60); place(aux, L.aux, 90);
  tiles.forEach((t, j) => { t.classList.toggle("feat", j === i); t.querySelector(".prog i").style.width = "0"; });
  aux.style.setProperty("--acc", d.type === "live" ? "#00a5b5" : d.accent);
  const first = prev === undefined;
  swap(info, K.metaBlock(d, { noTagline: true }), first ? 0 : 520);
  swap(aux, AUX(d), first ? 0 : 620);
  K.syncVideos(tiles[i]);
}

K.rot = K.Rotator({
  count: N, minGap: 700,
  durationFor: (i) => (K.data[i].type === "live" ? 11000 : 8000),
  onChange: (i, prev) => show(i, prev),
  onTick: (p, i) => { tiles[i].querySelector(".prog i").style.width = (p * 100).toFixed(1) + "%"; },
});
show(0);
K.refreshHud();
</script>
</body>
</html>
