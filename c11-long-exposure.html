<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C11 · Long Exposure — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  /* Long-exposure photography as the transition language. The next title is always on screen as a
     light streak along the right edge: its key art smeared sideways, with its title art sharp on top.
     The streak widens and brightens as the timer runs. On advance it sweeps across the whole screen
     and the smear resolves into the sharp picture. */
  .stage { background: #000; }
  .stage .page-nav { mix-blend-mode: screen; }
  .bd { position: absolute; inset: 0; z-index: 1; }
  .bd .art > * { width: 100%; height: 100%; object-fit: cover; animation: drift 16s linear both; }
  @keyframes drift { from { transform: scale(1.06) translateX(-14px); } to { transform: scale(1) translateX(0); } }
  .bd .scrim { background:
      linear-gradient(90deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,.45) 30%, rgba(0,0,0,0) 56%),
      linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 18%),
      linear-gradient(0deg, #000 0%, #000 8%, rgba(0,0,0,.5) 20%, rgba(0,0,0,0) 42%); }

  /* Smear canvas: draws the streak peek and the sweep transition */
  #fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 6; pointer-events: none; }

  .copy { position: absolute; z-index: 20; left: 120px; bottom: 170px; width: 760px; display: flex; flex-direction: column; align-items: flex-start; }
  .copy > * + * { margin-top: 20px; }
  .copy .logo img { max-width: 580px; max-height: 200px; }
  .copy .ctas { margin-top: 28px !important; }
  .copy.out { transition: opacity .3s var(--ease-std), transform .5s var(--ease-std), filter .4s; opacity: 0; transform: translateX(-60px); filter: blur(6px); }
  .stagger > * { --delay: 700ms; }

  /* The peek: title art of the next item, sharp, riding the streak */
  .peek { position: absolute; z-index: 21; right: 120px; bottom: 170px; width: 260px; height: 400px; border-radius: 18px;
    display: flex; align-items: flex-end; justify-content: center; padding: 0 22px 26px;
    transition: opacity .35s var(--ease-std), box-shadow .2s var(--ease-std); }
  .peek img { max-width: 100%; max-height: 110px; object-fit: contain; filter: drop-shadow(0 3px 14px rgba(0,0,0,.7)); }
  .peek.gone { opacity: 0; }
  .stage .page-rail { z-index: 22; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div id="bds"></div>
  <canvas id="fx" width="960" height="540"></canvas>
  <div id="copyHost" class="is-active"></div>
  <div class="peek" id="peek"><img alt="" draggable="false"></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script src="shared/hero-focus.js"></script>
<script>
const K = HeroKit.init({
  title: "C11 · Long Exposure",
  notes: "Long-exposure photography as the transition. The next title is always on screen as a light streak along the right edge: its key art smeared sideways with its title art sharp on top. The streak widens as the timer runs, then sweeps across the screen and resolves into the sharp picture.",
  extraKeys: [["↑ ↓", "Nav / hero / rail"], ["→ past +", "Bring the next title into the hero"]],
});

const N = K.data.length, bds = document.getElementById("bds"), copyHost = document.getElementById("copyHost");
const peekEl = document.getElementById("peek"), cv = document.getElementById("fx"), ctx = cv.getContext("2d");
const CW = 960, CH = 540, S = CW / 1920;            /* canvas runs at half res, scaled up by CSS */
const still = (d) => d.art.kind === "video" ? (d.art.still || d.art.poster) : d.art.src;
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* Preload stills and a few pre-smeared versions of each (resampled to a handful of columns) */
const imgs = K.data.map((d) => { const im = new Image(); im.src = still(d); return im; });
const tmp = document.createElement("canvas"), tctx = tmp.getContext("2d");
/* Draw image i into dest rect, smeared horizontally: cols = how many columns survive (lower = longer exposure) */
function smear(i, cols, dx, dy, dw, dh, alpha = 1) {
  const im = imgs[i]; if (!im.complete || !im.naturalWidth) return;
  cols = Math.max(2, Math.round(cols));
  /* cover-fit crop of the source to the stage aspect */
  const ar = 1920 / 1080, iar = im.naturalWidth / im.naturalHeight;
  let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
  if (iar > ar) { sw = sh * ar; sx = (im.naturalWidth - sw) * (K.data[i].focusX ?? .5); } else { sh = sw / ar; sy = (im.naturalHeight - sh) / 2; }
  /* map the dest rect back to the source crop so the streak lines up with where the picture will land */
  const fx0 = dx / CW, fx1 = (dx + dw) / CW;
  tmp.width = cols; tmp.height = 90;
  tctx.imageSmoothingEnabled = true; tctx.imageSmoothingQuality = "high";
  tctx.drawImage(im, sx + sw * fx0, sy, sw * (fx1 - fx0), sh, 0, 0, cols, 90);
  ctx.save(); ctx.globalAlpha = alpha; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(tmp, 0, 0, cols, 90, dx, dy, dw, dh);
  ctx.restore();
  /* re-add a little vertical detail so it reads as motion, not a flat gradient */
  if (cols < 200) { ctx.save(); ctx.globalAlpha = alpha * Math.max(0, .35 - cols / 600); ctx.globalCompositeOperation = "screen";
    tmp.width = 1; tmp.height = CH; tctx.drawImage(im, sx + sw * fx1 - 2, sy, 2, sh, 0, 0, 1, CH);
    ctx.drawImage(tmp, 0, dy, 1, dh, dx, dy, dw, dh); ctx.restore(); }
}

/* Streak band geometry (canvas px). Width grows with the timer. */
const PEEK_TOP = 140 * S, PEEK_BOT = 930 * S;
let trans = null, curI = 0;

function drawPeek(p) {
  const next = (curI + 1) % N;
  const w = (230 + p * 230) * S, x = CW - w;
  ctx.clearRect(0, 0, CW, CH);
  /* feathered left edge: draw the streak then fade it in from the left with a gradient mask */
  ctx.save();
  smear(next, 3 + p * 3, x, PEEK_TOP, w, PEEK_BOT - PEEK_TOP, .55 + p * .4);
  ctx.globalCompositeOperation = "destination-in";
  const g = ctx.createLinearGradient(x, 0, x + w * .7, 0);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = g; ctx.fillRect(x, PEEK_TOP, w, PEEK_BOT - PEEK_TOP);
  const v = ctx.createLinearGradient(0, PEEK_TOP, 0, PEEK_BOT);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(.12, "rgba(0,0,0,1)"); v.addColorStop(.88, "rgba(0,0,0,1)"); v.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = v; ctx.fillRect(x, PEEK_TOP, w, PEEK_BOT - PEEK_TOP);
  ctx.restore();
  /* a bright leading line at the streak's edge = the timer's front */
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const lx = x + w * .35, lg = ctx.createLinearGradient(lx - 10, 0, lx + 10, 0);
  lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(.5, `rgba(255,255,255,${.1 + p * .25})`); lg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = lg; ctx.fillRect(lx - 10, PEEK_TOP + 20, 20, PEEK_BOT - PEEK_TOP - 40);
  ctx.restore();
}

/* Transition: sweep (streak floods leftward) then resolve (columns 3 → full res) */
function drawTrans(now) {
  const t = Math.min(1, (now - trans.t0) / 1250);
  ctx.clearRect(0, 0, CW, CH);
  const sweep = ease(Math.min(1, t / .42));
  const res = t < .38 ? 0 : ease((t - .38) / .62);
  const x = (CW - (trans.fromW)) * (1 - sweep);
  const cols = 3 * Math.pow(CW / 3, res);
  const top = PEEK_TOP * (1 - sweep), bot = PEEK_BOT + (CH - PEEK_BOT) * sweep;
  smear(trans.i, cols, x, top, CW - x, bot - top, 1);
  if (t >= 1) { trans = null; return true; }
  if (t > .9) { cv.style.opacity = String(1 - (t - .9) / .1); }
  return false;
}

function ctaHtml(d) {
  const list = d.ctas.some((c) => c.icon === "plus") ? d.ctas : [...d.ctas, { icon: "plus", label: "My Stuff" }];
  return list.map((c, k) => k === 0 ? `<span class="btn is-focused">${K.ICONS[c.icon]}${c.label}</span>` : `<span class="btn btn--sq">${K.ICONS[c.icon]}</span>`).join("");
}
function copy(d) {
  const meta = d.meta.filter((m) => !(d.type === "live" && m === "Live"));
  const b = d.type === "live" ? `<span class="badge badge--live"><span class="dot"></span>Live</span>` : d.status ? `<span class="badge badge--new">${d.status.badge}</span>` : "";
  return `<div class="copy stagger">
    ${b ? `<div class="status-row" style="--i:0">${b}</div>` : ""}
    <div class="logo" style="--i:1"><img src="${d.logo}" alt="${d.logoAlt || ""}" draggable="false"></div>
    <div class="meta" style="--i:2">${meta.map((m, k) => k === 0 ? `<span class="net">${m}</span>` : `<span>${m}</span>`).join("")}</div>
    <div class="ctas" style="--i:3">${ctaHtml(d)}</div>
  </div>`;
}

let curBd = null, lastP = 0;
function show(i, prev) {
  const d = K.data[i];
  const bd = document.createElement("div"); bd.className = "bd";
  bd.innerHTML = `<div class="art">${K.art(d)}</div><div class="scrim"></div>`;
  if (prev === undefined) { bds.append(bd); curBd = bd; }
  else {
    /* The real picture lands under the canvas once the smear has mostly resolved */
    trans = { i, t0: performance.now(), fromW: (230 + lastP * 230) * S };
    cv.style.opacity = "1";
    peekEl.classList.add("gone");
    setTimeout(() => { if (curBd) curBd.remove(); bds.append(bd); curBd = bd; K.syncVideos(bd); }, 1050);
    setTimeout(() => setPeek(), 1200);
  }
  const oldCopy = copyHost.querySelector(".copy"); if (oldCopy) { oldCopy.classList.add("out"); setTimeout(() => oldCopy.remove(), 500); }
  copyHost.insertAdjacentHTML("beforeend", copy(d));
  curI = i;
  if (prev === undefined) { setPeek(); K.syncVideos(bd); }
  focus && focus.refresh();
}
function setPeek() {
  const n = K.data[(curI + 1) % N];
  peekEl.querySelector("img").src = n.logo;
  peekEl.classList.remove("gone");
}

let focus = null;
K.rot = K.Rotator({
  count: N, minGap: 900,
  durationFor: (i) => K.data[i].dwell || 8000,
  onChange: (i, prev) => show(i, prev),
  onTick: (p) => {
    if (trans) { if (drawTrans(performance.now())) { cv.style.opacity = "1"; drawPeek(0); } return; }
    lastP = p; drawPeek(p);
  },
});
focus = HeroFocus.init(K, {
  ctas: () => [...copyHost.querySelectorAll(".copy:not(.out) .btn")],
});
show(0);
K.refreshHud();
</script>
</body>
</html>
