<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>06 · Live Takeover — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  :root { --tk: .9s; --tk-ease: cubic-bezier(.77, 0, .18, 1); }

  /* Card → full-bleed. (Prototype animates box geometry; production should scale a video layer with transforms.) */
  .card { transition: left var(--tk) var(--tk-ease), top var(--tk) var(--tk-ease), width var(--tk) var(--tk-ease), height var(--tk) var(--tk-ease), border-radius var(--tk) var(--tk-ease); }
  .stage.takeover .card { left: 0; top: 0; width: 1920px; height: 1080px; border-radius: 0; z-index: 70; }
  .stage.takeover .page-rail { opacity: 0; transform: translateY(60px); }

  .slide { opacity: 0; transition: opacity 1s var(--ease-std); }
  .slide.is-active { opacity: 1; z-index: 3; }
  .slide.is-prev { opacity: 1; z-index: 2; transition: none; }
  .slide.is-prev .meta-block { opacity: 0; transition: opacity .3s; }
  .kb { position: absolute; inset: 0; animation: kb 12s linear forwards; transform-origin: 70% 40%; }
  @keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.1); } }
  .slide[data-type="live"] .kb { animation: none; }
  .is-active .stagger > * { --delay: 420ms; }

  /* Metadata collapses to essentials in takeover */
  .meta-block { transition: left var(--tk) var(--tk-ease), bottom var(--tk) var(--tk-ease); }
  .stage.takeover .meta-block { left: 120px; bottom: 96px; }
  .collapsible { max-height: 90px; overflow: hidden; transition: max-height .6s var(--tk-ease), opacity .4s, margin .6s var(--tk-ease); }
  .stage.takeover .collapsible { max-height: 0; opacity: 0; margin-top: 0 !important; }
  .logo img { transition: max-height var(--tk) var(--tk-ease), max-width var(--tk) var(--tk-ease); }
  .stage.takeover .logo img { max-height: 120px; max-width: 320px; }
  .ctas { transition: margin var(--tk) var(--tk-ease); }

  .scrim { transition: opacity var(--tk); }
  .stage.takeover .scrim { opacity: .35; }
  .scrim-video { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--tk);
    background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.35) 30%, rgba(0,0,0,0) 55%), linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%); }
  .stage.takeover .scrim-video { opacity: 1; }

  /* Takeover chrome */
  .tk-chip { position: absolute; z-index: 40; top: 64px; right: 120px; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 18px; border-radius: 10px;
    background: rgba(0,0,0,.5); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font: 600 20px/1 var(--f-ui); color: var(--ink-2);
    opacity: 0; transform: translateY(-12px); transition: opacity .5s .4s, transform .5s .4s var(--ease-out); }
  .tk-chip svg { width: 24px; height: 24px; fill: #fff; }
  .tk-hint { position: absolute; z-index: 40; right: 120px; bottom: 112px; font: 600 20px/1.4 var(--f-ui); color: var(--ink-2); text-align: right;
    opacity: 0; transition: opacity .5s .6s; }
  .tk-hint kbd { font: 700 16px/1 var(--f-ui); padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.18); color: #fff; }
  .stage.takeover .tk-chip { opacity: 1; transform: none; }
  .stage.takeover .tk-hint { opacity: 1; }
  .stage.takeover .peek { opacity: 0; } .peek { transition: opacity .4s; }
  .tk-arm { position: absolute; z-index: 40; right: var(--pad); bottom: calc(var(--pad) + 186px); display: flex; align-items: center; gap: 12px; font: 600 18px/1 var(--f-ui); color: var(--ink-2); opacity: 0; transition: opacity .3s; }
  .tk-arm.is-on { opacity: 1; }
  .stage.takeover .tk-arm { opacity: 0; }
  .tk-arm .ring { width: 30px; height: 30px; }
  .tk-arm circle { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 88; stroke-dashoffset: 88; transform: rotate(-90deg); transform-origin: center; }

  .toast { position: absolute; z-index: 45; left: 120px; top: 120px; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 22px; border-radius: 12px; background: #fff; color: #000;
    font: 800 24px/1 var(--f-ui); transform: translateX(-30px); opacity: 0; transition: opacity .4s, transform .5s var(--ease-out); }
  .toast i { font-style: normal; padding: 6px 10px; border-radius: 6px; background: var(--live); color: #fff; font-size: 18px; }
  .toast.is-on { opacity: 1; transform: none; }

  .pips { display: none !important; position: absolute; z-index: 30; right: var(--pad); top: var(--pad); display: flex; gap: 8px; transition: opacity .4s; }
  .pip { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); overflow: hidden; }
  .pip i { display: block; height: 100%; width: 0; background: #fff; }
  .pip.live { background: rgba(224,16,47,.45); } .pip.live i { background: var(--live-hot); }
  .stage.takeover .pips { opacity: 0; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="card" id="card"><div class="grain"></div></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "06 · Live Takeover",
  notes: "Live gets priority: after 3.5s idle on a live slide the card expands to full-bleed under the nav, the rail clears, and metadata collapses to badge + CTAs while the muted live feed plays. Any D-pad press returns to the card. Live dwells 18s; others 8s.",
  extraKeys: [["Enter", "Enter / exit takeover (live slide)"]]
});
const stage = K.stage, card = document.getElementById("card");
const ARM_AT = 3500, EXIT_AT = 16800;

K.data.forEach((item) => {
  let mb = K.metaBlock(item);
  // mark secondary rows collapsible in takeover
  mb = mb.replace(/class="(meta|livebar|tagline|social|countdown|sponsor)"/g, 'class="$1 collapsible"');
  card.insertAdjacentHTML("beforeend", `
    <div class="slide layer" data-type="${item.type}">
      <div class="kb"><div class="art">${K.art(item)}</div></div>
      <div class="scrim"></div><div class="scrim-video"></div>${mb}
    </div>`);
});
card.insertAdjacentHTML("beforeend", `
  <div class="pips">${K.data.map((d) => `<div class="pip ${d.type === "live" ? "live" : ""}"><i></i></div>`).join("")}</div>
  <div class="tk-arm" id="arm"><svg class="ring" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/></svg>Live preview</div>
  <div class="tk-chip">${K.ICONS.mute}Live preview · Muted</div>
`);
const slides = [...card.querySelectorAll(".slide")], pips = [...card.querySelectorAll(".pip")];
const arm = document.getElementById("arm"), armRing = arm.querySelector("circle");
let prevT, userExit = false;

function setTakeover(on) {
  if (stage.classList.contains("takeover") === on) return;
  stage.classList.toggle("takeover", on);
}
function show(i, prev) {
  setTakeover(false); userExit = false;
  slides.forEach((s) => s.classList.remove("is-prev"));
  if (prev !== undefined && prev !== i) slides[prev].classList.add("is-prev");
  slides.forEach((s, n) => s.classList.toggle("is-active", n === i));
  const kb = slides[i].querySelector(".kb"); kb.style.animation = "none"; void kb.offsetWidth; kb.style.animation = "";
  K.replay(slides[i]);
  clearTimeout(prevT); prevT = setTimeout(() => slides.forEach((s) => s.classList.remove("is-prev")), 1100);
  pips.forEach((p, n) => (p.querySelector("i").style.width = n < i ? "100%" : "0"));
}

K.rot = K.Rotator({
  count: K.data.length,
  durationFor: (i) => (K.data[i].type === "live" ? 18000 : K.data[i].dwell || 8000),
  onChange: (i, prev) => show(i, prev),
  onTick: (p, i, elapsed) => {
    pips[i].querySelector("i").style.width = (p * 100).toFixed(1) + "%";
    const live = K.data[i].type === "live";
    const arming = live && !userExit && elapsed > 1000 && elapsed < ARM_AT && !stage.classList.contains("takeover");
    arm.classList.toggle("is-on", arming);
    if (arming) armRing.style.strokeDashoffset = (88 * (1 - (elapsed - 1000) / (ARM_AT - 1000))).toFixed(1);
    if (live && !userExit) setTakeover(elapsed >= ARM_AT && elapsed < EXIT_AT);
  },
});

K.onKey((e) => {
  const on = stage.classList.contains("takeover");
  if (e.key === "Enter" && K.zone === "hero" && K.focus.cta === 0) {
    if (K.data[K.rot.index].type !== "live") return false;
    userExit = on; setTakeover(!on); return true;
  }
  if (on && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Escape" || e.key === "Backspace")) {
    userExit = true; setTakeover(false); return true;   // first press only exits — doesn't skip content
  }
});

show(0);
K.mountPeek(card);
K.refreshHud();
</script>
</body>
</html>
