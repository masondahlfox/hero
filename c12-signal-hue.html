<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C12 · Signal Hue — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  /* One vivid hue per title, taken from the FOX One Nebula palette. The footage is pulled toward grey so the hue
     owns the frame ("grey builds the interface, colour carries meaning"). Every element on top of the picture —
     the typeset title, badge, meta, line, CTAs, the next-title peek and its timer — speaks in that one hue.
     Titles are set in type, not logo art, and their letters flip in from a mirror image. */
  .stage { background: #000; --hue: #63d7c5; }

  .bd { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
  .bd .art { position: absolute; inset: 0; }
  .bd .art > * { width: 100%; height: 100%; object-fit: cover; filter: saturate(.42) contrast(1.06) brightness(.86); animation: drift 14s linear both; }
  @keyframes drift { from { transform: scale(1.07); } to { transform: scale(1.0); } }
  .bd .scrim { position: absolute; inset: 0; background:
      linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.5) 34%, rgba(0,0,0,0) 62%),
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 20%),
      linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.35) 24%, rgba(0,0,0,0) 46%); }
  /* faint hue wash in the shadows ties the grey footage to the title colour */
  .bd .wash { position: absolute; inset: 0; background: radial-gradient(120% 90% at 0% 100%, var(--h) 0%, transparent 60%); mix-blend-mode: soft-light; opacity: .55; }

  /* Incoming picture opens out of the peek card's rectangle */
  .bd.enter { clip-path: inset(var(--t) var(--r) var(--b) var(--l) round 20px); animation: open 1.05s var(--ease-inout) forwards; }
  .bd.enter.back { clip-path: inset(0 100% 0 0); animation: openBack .9s var(--ease-inout) forwards; }
  @keyframes open { to { clip-path: inset(0 0 0 0 round 0); } }
  @keyframes openBack { to { clip-path: inset(0 0 0 0); } }
  .bd.leave .art > * { transition: filter .9s; filter: saturate(0) brightness(.45); }

  /* ---------- Lockup: all in the title's hue ---------- */
  .copy { position: absolute; z-index: 20; left: 120px; bottom: 172px; width: 1080px; display: flex; flex-direction: column; align-items: flex-start; color: var(--h); }
  .copy > * + * { margin-top: 22px; }
  .copy.out { transition: opacity .35s .25s var(--ease-std); opacity: 0; }
  .copy .stagger { display: flex; flex-direction: column; align-items: flex-start; }
  .copy .stagger > * + * { margin-top: 22px; }

  .vt { font: 800 150px/.9 var(--f-ui); letter-spacing: -.045em; color: var(--h);
        perspective: 1400px; max-width: 1100px; text-shadow: 0 8px 40px rgba(0,0,0,.35); margin-bottom: 6px; }
  .vt .ln { display: block; white-space: nowrap; }
  .vt .vs { font-style: normal; font-weight: 600; font-size: .4em; letter-spacing: -.01em; margin: 0 .12em 0 .04em; }
  .vt .ch { display: inline-block; transform-origin: 50% 60%; backface-visibility: visible; opacity: 0; }
  .vt .sp { display: inline-block; width: .22em; }
  .is-in .vt .ch { animation: flipIn .9s var(--ease-out) both; animation-delay: calc(380ms + var(--j) * 46ms); }
  @keyframes flipIn {
    0% { opacity: 0; transform: rotateY(180deg) translateY(.12em); }
    18% { opacity: 1; }
    62% { transform: rotateY(-14deg); }
    100% { opacity: 1; transform: none; }
  }
  .out .vt .ch { animation: flipOut .45s var(--ease-inout) both; animation-delay: calc(var(--j) * 22ms); }
  @keyframes flipOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: rotateY(-180deg); } }
  .copy.settled .vt .ch { opacity: 1; animation: none; }
  .copy.settled .vt .ch.blink { animation: blink 1.1s var(--ease-inout) both; }
  @keyframes blink { 0% { transform: none; } 45%, 55% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }

  .meta, .tagline { color: var(--h); }
  .meta .badge--spec { background: transparent; color: var(--h); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--h) 70%, transparent); }
  .meta .badge--live, .meta .badge--new { background: var(--h); color: #000; }
  .meta .badge--live .dot { background: #000; }
  .tagline { opacity: .88; }

  .copy .ctas { margin-top: 34px !important; }
  .copy .btn { color: var(--h); }
  .copy .btn--primary { background: color-mix(in srgb, var(--h) 16%, rgba(0,0,0,.25)); box-shadow: inset 0 0 0 2px var(--h); }
  .copy .btn--round { background: rgba(0,0,0,.18); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--h) 55%, transparent); }
  .copy .btn.is-focused { background: var(--h); color: #000; box-shadow: 0 0 0 0 transparent, 0 12px 40px color-mix(in srgb, var(--h) 45%, transparent); }

  .stagger > * { --delay: 620ms; }
  .is-in .stagger > * { animation: rise .75s var(--ease-out) both; animation-delay: calc(var(--delay) + var(--i, 0) * 80ms); }

  /* Nav stays the shared FOX One nav; its focus state picks up the current hue */
  .fo-nav__item.is-focused { background: var(--hue); color: #000; }
  .fo-nav__profile.is-focused { box-shadow: 0 0 0 4px var(--hue); }

  /* ---------- Peek: next title as a story card on the right, in ITS hue. Never focusable. ---------- */
  .np { position: absolute; z-index: 22; right: 120px; bottom: 172px; width: 300px; height: 440px; }
  .np__card { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: #111;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 0 1.5px color-mix(in srgb, var(--h) 40%, transparent);
    transition: transform .7s var(--ease-out), opacity .5s var(--ease-std); }
  .np__card img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.3) brightness(.7); }
  .np__card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 62%); }
  .np__bar { position: absolute; z-index: 2; left: 18px; right: 18px; top: 16px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--h) 28%, transparent); overflow: hidden; }
  .np__bar i { display: block; height: 100%; width: 0; background: var(--h); }
  .np__label { position: absolute; z-index: 2; left: 20px; top: 36px; font: 600 17px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--h); opacity: .9; }
  .np__t { position: absolute; z-index: 2; left: 20px; right: 16px; bottom: 22px; font: 800 50px/.9 var(--f-ui); letter-spacing: -.04em; color: var(--h); }
  .np__t .vs { font-style: normal; font-weight: 600; font-size: .4em; }
  .np__t .ln { display: block; }
  .np__card.pre { transform: translateX(440px); opacity: 0; }
  .np__card.gone { opacity: 0; transition: opacity .15s; }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div id="bds"></div>
  <div id="copyHost"></div>
  <div class="np" id="np"></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script src="shared/hero-focus.js"></script>
<script>
const K = HeroKit.init({
  title: "C12 · Signal Hue",
  notes: "One vivid Nebula hue per title. The footage is pulled toward grey so the hue owns the frame, and everything on top of it (typeset title, badge, meta, line, CTAs, the next-title peek and its timer) speaks in that hue. Titles are set in type, and their letters flip in from a mirror image. On advance the picture opens out of the peek card.",
  extraKeys: [["→ past +", "Bring the next title into the hero"]],
});

/* Nebula hue defaults (sampled from the FOX One Nebula colour strip) */
const NEBULA = { red: "#e24749", orange: "#ed7646", amber: "#f09845", yellow: "#f7d849", chartreuse: "#bcd544", lime: "#9dd350",
  green: "#79cf60", teal: "#63d7c5", cyan: "#5fcfdf", sky: "#6bd0fa", blue: "#52b5f8", cobalt: "#5480f7", indigo: "#727bf7",
  violet: "#8e70f7", purple: "#a860f7", magenta: "#cd3dea", pink: "#e240a9" };
/* One hue + a typeset title per title (no logo art in this concept) */
const LOOK = {
  "eagles-cowboys": { hue: NEBULA.teal,    lines: ["Eagles", "<span class='vs'>vs</span>Cowboys"] },
  "best-medicine":  { hue: NEBULA.yellow,  lines: ["Best", "Medicine"] },
  "accused":        { hue: NEBULA.red,     lines: ["Accused"] },
  "fc-juarez":      { hue: NEBULA.lime,    lines: ["FC Juárez"] },
  "fox-soul":       { hue: NEBULA.magenta, lines: ["FOX Soul"] },
};
const look = (d) => LOOK[d.id] || { hue: NEBULA.sky, lines: [d.logoAlt || d.id] };

const N = K.data.length, stage = K.stage, bds = document.getElementById("bds"), copyHost = document.getElementById("copyHost"), np = document.getElementById("np");
const still = (d) => d.art.kind === "video" ? (d.art.still || d.art.poster) : d.art.src;

/* Split a title line into per-letter spans (keeps <span class='vs'> runs intact as words) */
function typeset(d) {
  let j = 0;
  const lines = look(d).lines.map((ln) => {
    const tmp = document.createElement("div"); tmp.innerHTML = ln;
    const out = [...tmp.childNodes].map((node) => {
      const text = node.textContent, wrap = node.nodeType === 1 ? (s) => `<span class="vs">${s}</span>` : (s) => s;
      return wrap([...text].map((c) => c === " " ? `<span class="sp"></span>` : `<span class="ch" style="--j:${j + (j++ * 3) % 4}">${c}</span>`).join(""));
    }).join("");
    return `<span class="ln">${out}</span>`;
  });
  return `<div class="vt" aria-label="${d.logoAlt}">${lines.join("")}</div>`;
}

function copy(d) {
  const st = (h, i) => h.replace(/^<(\w+) class="/, `<$1 style="--i:${i}" class="`);
  return `<div class="copy" style="--h:${look(d).hue}">${typeset(d)}<div class="stagger">${st(K.ui.metaRow(d), 0)}<div class="tagline" style="--i:1">${d.tagline}</div>${st(K.ui.ctas(d), 2)}</div></div>`;
}

function peekCard(d) {
  const L = look(d);
  return `<div class="np__card pre" style="--h:${L.hue}"><img src="${still(d)}" alt="" draggable="false" style="object-position:${Math.round((d.focusX ?? .5) * 100)}% 50%">
    <div class="np__bar"><i></i></div><div class="np__label">${d.type === "live" ? "Live next" : "Up next"}</div>
    <div class="np__t">${L.lines.map((l) => `<span class="ln">${l}</span>`).join("")}</div></div>`;
}
function setPeek(i, delay = 0) {
  const d = K.data[(i + 1) % N];
  np.querySelectorAll(".np__card").forEach((c) => c.remove());
  np.insertAdjacentHTML("beforeend", peekCard(d));
  const c = np.lastElementChild;
  setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove("pre"))), delay);
}

let curBd = null, curI = 0;
function show(i, prev, dir = 1) {
  const d = K.data[i], hue = look(d).hue;
  stage.style.setProperty("--hue", hue);
  const bd = document.createElement("div"); bd.className = "bd"; bd.style.setProperty("--h", hue);
  bd.innerHTML = `<div class="art">${K.art(d)}</div><div class="wash"></div><div class="scrim"></div>`;

  if (prev !== undefined) {
    if (dir > 0) {
      /* open out of the peek card's rectangle */
      const r = np.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = 1920 / s.width;
      bd.style.setProperty("--t", ((r.top - s.top) * k) + "px");
      bd.style.setProperty("--l", ((r.left - s.left) * k) + "px");
      bd.style.setProperty("--r", ((s.right - r.right) * k) + "px");
      bd.style.setProperty("--b", ((s.bottom - r.bottom) * k) + "px");
      bd.classList.add("enter");
    } else bd.classList.add("enter", "back");
    np.querySelectorAll(".np__card").forEach((c) => c.classList.add("gone"));
    if (curBd) { const old = curBd; old.classList.add("leave"); setTimeout(() => old.remove(), 1100); }
    setTimeout(() => setPeek(i), 700);
  } else setPeek(i, 400);
  bds.append(bd); curBd = bd; K.syncVideos(bd);

  const oldCopy = copyHost.querySelector(".copy:not(.out)");
  if (oldCopy) { oldCopy.classList.remove("is-in", "settled"); oldCopy.classList.add("out"); setTimeout(() => oldCopy.remove(), 800); }
  copyHost.insertAdjacentHTML("beforeend", copy(d));
  const c = copyHost.lastElementChild;
  requestAnimationFrame(() => c.classList.add("is-in"));
  const nCh = c.querySelectorAll(".vt .ch").length;
  setTimeout(() => { if (!c.classList.contains("out")) c.classList.add("settled"); }, 380 + (nCh + 4) * 46 + 950);
  curI = i;
  focus && focus.refresh();
}

/* Idle life: every few seconds one letter of the title flips through its mirror image */
setInterval(() => {
  const chs = [...copyHost.querySelectorAll(".copy.settled .vt .ch")]; if (!chs.length || (K.rot && K.rot.paused && K.zone !== "hero")) return;
  const el = chs[Math.floor(Math.random() * chs.length)];
  el.classList.remove("blink"); void el.offsetWidth; el.classList.add("blink");
  setTimeout(() => el.classList.remove("blink"), 1150);
}, 2600);

let focus = null;
K.rot = K.Rotator({
  count: N, minGap: 900,
  durationFor: (i) => K.data[i].dwell || 8000,
  onChange: (i, prev, dir) => show(i, prev, dir),
  onTick: (p) => { const b = np.querySelector(".np__card:not(.gone) .np__bar i"); if (b) b.style.width = (p * 100).toFixed(1) + "%"; },
});
focus = HeroFocus.init(K, {
  ctas: () => [...copyHost.querySelectorAll(".copy:not(.out) .btn")],
});
show(0);
K.refreshHud();
</script>
</body>
</html>
