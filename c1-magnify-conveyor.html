<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C1 · Magnify Conveyor — Fox One Multi-Hero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  .stage { --bgc: #070708; --fg: #fff; --fg2: rgba(255,255,255,.62); background: var(--bgc); transition: background .6s; }
  .stage.light { --bgc: #eeebe8; --fg: #121212; --fg2: rgba(0,0,0,.55); }
  .stage.light .page-nav { filter: invert(1) hue-rotate(180deg); }

  /* Poster: authored at max size (420×560) and scaled from its bottom-left corner — transform only, no layout per frame */
  .pc { position: absolute; left: 0; top: 0; width: 420px; height: 560px; transform-origin: 0 0; border-radius: var(--r-tile); overflow: hidden; background: #111; }
  .pc .art { inset: 0; }
  .pc .veil { position: absolute; inset: 0; background: var(--bgc); pointer-events: none; }
  .pc .badge { position: absolute; z-index: 2; left: 20px; top: 20px; transform-origin: 0 0; }

  /* Editorial field — the featured item's metadata lives in the open space */
  /* Lockup owns the top-left; the bell-curve peak sits right of center so the art never crowds it */
  .field { position: absolute; left: 120px; top: 170px; width: 760px; z-index: 5; }
  .field .meta-block { position: static; width: auto; }
  .field .logo img { max-height: 136px; max-width: 520px; }
  .field .logo--type { font-size: 92px; color: var(--fg); }
  .field .meta, .field .sponsor b { color: var(--fg); }
  .field .sponsor, .field .social { color: var(--fg2); }
  .field .livebar { color: var(--fg2); }
  .stage.light .field .logo img { filter: brightness(0); }
  .stage.light .field .tagline { color: var(--fg2); }
  .stage.light .field .btn--round { background: rgba(0,0,0,.06); color: #111; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .stage.light .field .btn.is-focused { background: #111; color: #fff; }
  .field .ctas { margin-top: 22px !important; }
  .fwrap.out { position: absolute; left: 0; top: 0; opacity: 0; transform: translateY(-12px); transition: opacity .35s, transform .35s; }
  .is-active .stagger > * { --delay: 120ms; animation-duration: .6s; }


  .prog { position: absolute; z-index: 6; top: 1030px; height: 3px; left: 0; border-radius: 2px; background: rgba(127,127,127,.3); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--fg); }
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="field" id="field"></div>
  <div id="belt"></div>
  <div class="prog" id="prog"><i></i></div>
</div></div>

<script src="shared/data.js"></script>
<script src="shared/art.js"></script>
<script src="shared/stage.js"></script>
<script>
const K = HeroKit.init({
  title: "C1 · Magnify Conveyor",
  notes: "From your reference: portrait posters ride one baseline; size follows a bell curve around center (dock magnification), so motion is continuous rather than slide-to-slide. The peak sits right of center so the top-left stays a clean lockup for whichever title is at the peak. Uses the vertical asset.",
  extraKeys: [["M", "Mode: step-and-glide ↔ constant marquee"], ["T", "Theme: dark ↔ light editorial"]],
  rail: false,
});
const stage = K.stage, belt = document.getElementById("belt"), field = document.getElementById("field");
// SLOTS must be a multiple of N so the poster at the peak is always the title shown in the lockup
const N = K.data.length, SLOTS = N * 2, HALF = SLOTS / 2;
// Bell-curve sizing (px). Center-to-center spacing is the integral of width, so neighbours never overlap.
const W_MAX = 420, W_MIN = 130, GAP = 18, A = 1.45, BASE = 1016, CX = 1280;
const erf = (x) => { const t = 1 / (1 + .3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
const width = (u) => W_MIN + (W_MAX - W_MIN) * Math.exp(-((u / A) ** 2));
const center = (u) => CX + (W_MIN + GAP) * u + (W_MAX - W_MIN) * A * Math.sqrt(Math.PI) / 2 * erf(u / A);

const cards = [];
for (let j = 0; j < SLOTS; j++) {
  const item = K.data[j % N];
  const el = document.createElement("div"); el.className = "pc";
  el.innerHTML = `<div class="art">${K.art(item, "all", { noAutoplay: true })}</div>
    ${item.type === "live" ? K.ui.badge(item, { tile: true }) : ""}<div class="veil"></div>`;
  belt.append(el);
  cards.push({ el, veil: el.querySelector(".veil"), video: el.querySelector("video"), item });
}

let s = 0, T = 0, mode = "step", feat = -1, last = performance.now();
const prog = document.getElementById("prog"), progI = prog.querySelector("i");

function setFeatured(i) {
  if (i === feat) return; feat = i;
  const old = field.querySelector(".fwrap:not(.out)");
  if (old) { old.classList.add("out"); setTimeout(() => old.remove(), 400); }
  field.insertAdjacentHTML("beforeend", `<div class="fwrap">${K.metaBlock(K.data[i], { noSocial: true })}</div>`);
  const nb = field.lastElementChild; void nb.offsetWidth; nb.classList.add("is-active");
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === "drift") { if (!K.rot.paused) { s += dt * .14; T = Math.round(s); } }
  else s += (T - s) * (1 - Math.exp(-dt * 3.4));     // critically-damped glide toward target

  let featW = 0;
  cards.forEach((c, j) => {
    const u = ((((j - s + HALF) % SLOTS) + SLOTS) % SLOTS) - HALF;
    const w = width(u), h = w * 4 / 3, x = center(u) - w / 2, k = w / W_MAX;
    c.el.style.transform = `translate(${x.toFixed(1)}px, ${(BASE - h).toFixed(1)}px) scale(${k.toFixed(4)})`;
    c.el.style.zIndex = 100 - Math.round(Math.abs(u) * 10);
    c.veil.style.opacity = Math.min(.82, Math.max(0, (Math.abs(u) - .6) * .26)).toFixed(3);
    if (Math.abs(u) < .5) { featW = w; prog.style.transform = `translateX(${x.toFixed(1)}px)`; }
    if (c.video) { const near = Math.abs(u) < 1.6; if (near && c.video.paused) c.video.play().catch(() => {}); else if (!near && !c.video.paused) c.video.pause(); }
  });
  prog.style.width = featW.toFixed(1) + "px";
  setFeatured(((Math.round(s) % N) + N) % N);
  requestAnimationFrame(frame);
}

K.rot = K.Rotator({
  count: N, minGap: 250,
  durationFor: (i) => (K.data[i].type === "live" ? 11000 : 7500),
  onChange: (i, prev, dir) => { if (mode === "step") T += dir; },
  onTick: (p) => { progI.style.width = mode === "step" ? (p * 100).toFixed(1) + "%" : "0"; },
});
K.onKey((e) => {
  if (e.key === "m" || e.key === "M") { mode = mode === "step" ? "drift" : "step"; T = Math.round(s); return true; }
  if (e.key === "t" || e.key === "T") { stage.classList.toggle("light"); return true; }
  if (mode === "drift" && K.zone === "hero" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { mode = "step"; T = Math.round(s); }
});
requestAnimationFrame(frame);
K.refreshHud();
</script>
</body>
</html>
